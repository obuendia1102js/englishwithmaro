<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuel's English Starter</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kids: ['Balsamiq Sans', 'cursive'],
            ui: ['Nunito', 'sans-serif'],
          },
          colors: {
            brand: {
              yellow: '#FCD34D',
              orange: '#FB923C',
              red: '#F87171',
              pink: '#F472B6',
              purple: '#A78BFA',
              blue: '#60A5FA',
              green: '#34D399'
            }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #F0FDF4; }
    h1, h2, h3, .font-kids { font-family: 'Balsamiq Sans', cursive; }
    
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .hover-wiggle:hover { animation: wiggle 0.3s ease-in-out infinite; }
    
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-popIn { animation: popIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }

    .emoji-shadow { filter: drop-shadow(0 8px 6px rgba(0,0,0,0.15)); }
  </style>
</head>

<body class="min-h-screen flex flex-col text-slate-800 selection:bg-brand-yellow">

  <header class="bg-white border-b-4 border-slate-100 p-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
        <div class="w-12 h-12 rounded-full bg-brand-blue flex items-center justify-center text-white text-2xl shadow-lg border-2 border-white emoji-shadow">
          👦🏽
        </div>
        <div>
          <h1 class="text-2xl font-kids font-bold text-brand-blue leading-tight tracking-wide">Manuel's English</h1>
          <p class="text-sm font-black text-brand-orange uppercase tracking-widest">Starter 🚀</p>
        </div>
      </div>

      <div class="bg-brand-yellow px-4 py-2 rounded-2xl shadow-sm border-2 border-yellow-400 flex items-center gap-2">
        <i class="fa-solid fa-star text-orange-500 text-xl"></i>
        <span id="globalStars" class="font-black text-xl text-orange-600 font-kids">0</span>
      </div>
    </div>
  </header>

  <main class="flex-grow flex flex-col max-w-4xl mx-auto w-full p-4 relative overflow-hidden">
    
    <section id="view-home" class="flex-grow flex flex-col items-center justify-center space-y-8 py-8 animate-popIn">
      <div class="text-center space-y-2">
        <h2 class="text-4xl sm:text-5xl font-kids text-slate-700">¡Hola <span class="text-brand-blue">Manuel</span>!</h2>
        <p class="text-xl text-slate-500 font-bold">¿Qué vamos a aprender hoy?</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl">
        <!-- Category: Animals -->
        <button onclick="selectCategory('animals')" class="group relative overflow-hidden bg-white border-4 border-brand-green rounded-3xl p-8 hover:-translate-y-2 transition-transform shadow-xl shadow-green-100 text-center hover-wiggle">
          <div class="text-8xl mb-4 emoji-shadow transition-transform group-hover:scale-110">🐶</div>
          <h3 class="text-3xl font-kids font-bold text-brand-green">Animals</h3>
          <p class="text-slate-400 font-bold mt-2 uppercase tracking-wide">Animales</p>
        </button>

        <!-- Category: Colors -->
        <button onclick="selectCategory('colors')" class="group relative overflow-hidden bg-white border-4 border-brand-purple rounded-3xl p-8 hover:-translate-y-2 transition-transform shadow-xl shadow-purple-100 text-center hover-wiggle">
          <div class="text-8xl mb-4 emoji-shadow transition-transform group-hover:scale-110">🎨</div>
          <h3 class="text-3xl font-kids font-bold text-brand-purple">Colors</h3>
          <p class="text-slate-400 font-bold mt-2 uppercase tracking-wide">Colores</p>
        </button>
      </div>
    </section>

    <section id="view-menu" class="hidden flex-grow flex-col items-center justify-center space-y-8 py-8">
      <button onclick="goHome()" class="self-start text-slate-400 hover:text-brand-blue font-bold text-lg mb-4 flex items-center gap-2">
        <i class="fa-solid fa-circle-arrow-left text-2xl"></i> Volver
      </button>

      <div class="text-center space-y-2">
        <div id="menu-icon" class="text-6xl emoji-shadow mb-2 animate-bounce"></div>
        <h2 id="menu-title" class="text-4xl sm:text-5xl font-kids text-slate-700 capitalize">Title</h2>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl">
        <!-- Study Mode -->
        <button onclick="startStudy()" class="group bg-gradient-to-br from-blue-400 to-blue-500 border-4 border-blue-600 rounded-3xl p-8 hover:-translate-y-2 transition-transform shadow-xl shadow-blue-200 text-center text-white">
          <div class="text-7xl mb-4 emoji-shadow group-hover:scale-110 transition-transform">📖</div>
          <h3 class="text-3xl font-kids font-bold">Estudiar</h3>
          <p class="text-blue-100 font-bold mt-2">Mira y escucha las palabras</p>
        </button>

        <!-- Play Mode -->
        <button onclick="startPlay()" class="group bg-gradient-to-br from-orange-400 to-orange-500 border-4 border-orange-600 rounded-3xl p-8 hover:-translate-y-2 transition-transform shadow-xl shadow-orange-200 text-center text-white">
          <div class="text-7xl mb-4 emoji-shadow group-hover:scale-110 transition-transform">🎮</div>
          <h3 class="text-3xl font-kids font-bold">Jugar</h3>
          <p class="text-orange-100 font-bold mt-2">Adivina la palabra correcta</p>
        </button>
      </div>
    </section>

    <section id="view-study" class="hidden flex-grow flex-col space-y-6 pb-10">
      <div class="flex items-center justify-between mt-4">
        <button onclick="showMenu()" class="text-slate-400 hover:text-brand-blue font-bold text-lg flex items-center gap-2 bg-white px-4 py-2 rounded-2xl shadow-sm">
          <i class="fa-solid fa-circle-arrow-left text-2xl"></i> Volver
        </button>
        <h2 class="text-3xl font-kids text-slate-700" id="study-title">Estudiar</h2>
      </div>

      <div class="bg-blue-50 text-blue-600 p-4 rounded-2xl flex items-center justify-center gap-3 font-bold border-2 border-blue-200 shadow-inner">
        <i class="fa-solid fa-volume-high text-2xl animate-pulse"></i>
        <span>Toca cualquier tarjeta para escuchar cómo suena.</span>
      </div>

      <div id="study-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-6"></div>
    </section>

    <section id="view-play" class="hidden flex-grow flex-col max-w-xl mx-auto w-full space-y-6 pb-10">
      <div class="flex items-center justify-between mt-4 mb-4">
        <button onclick="showMenu()" class="text-slate-400 hover:text-brand-blue font-bold text-lg flex items-center gap-2 bg-white px-4 py-2 rounded-2xl shadow-sm">
          <i class="fa-solid fa-times text-2xl"></i> Salir
        </button>
        <div class="bg-brand-yellow text-orange-700 font-black px-4 py-2 rounded-2xl border-2 border-yellow-400 shadow-sm font-kids text-xl">
          <i class="fa-solid fa-star"></i> <span id="play-score">0</span>
        </div>
      </div>

      <div class="bg-white rounded-[2rem] shadow-2xl border-4 border-slate-100 p-6 sm:p-8 flex flex-col items-center relative overflow-hidden animate-popIn">
        
        <p class="text-slate-400 font-bold uppercase tracking-wider mb-4">¿Cuál palabra escuchas?</p>
        
        <button onclick="playCurrentWordAudio()" class="w-32 h-32 rounded-full bg-brand-blue hover:bg-blue-500 text-white flex items-center justify-center shadow-[0_10px_0_#2563EB] active:shadow-[0_0px_0_#2563EB] active:translate-y-[10px] transition-all mb-8 group">
          <i class="fa-solid fa-volume-high text-5xl group-hover:scale-110 transition-transform"></i>
        </button>

        <div id="play-options" class="grid grid-cols-3 gap-4 w-full"></div>
        
        <!-- Overlay Feedback -->
        <div id="play-feedback" class="absolute inset-0 bg-white/90 backdrop-blur-sm hidden flex-col items-center justify-center z-10">
          <div id="feedback-emoji" class="text-8xl mb-4 animate-bounce"></div>
          <h3 id="feedback-text" class="text-4xl font-kids font-bold text-slate-800"></h3>
        </div>
      </div>
    </section>

  </main>

  <script>
    const db = {
      animals: {
        title: "Animals",
        icon: "🐶",
        colorClass: "border-brand-green",
        items: [
          { word: "Dog", emoji: "🐶" },
          { word: "Cat", emoji: "🐱" },
          { word: "Bird", emoji: "🐦" },
          { word: "Monkey", emoji: "🐒" },
          { word: "Frog", emoji: "🐸" },
          { word: "Pig", emoji: "🐷" },
          { word: "Cow", emoji: "🐮" },
          { word: "Lion", emoji: "🦁" },
          { word: "Bear", emoji: "🐻" }
        ]
      },
      colors: {
        title: "Colors",
        icon: "🎨",
        colorClass: "border-brand-purple",
        items: [
          { word: "Red", emoji: "🔴" },
          { word: "Blue", emoji: "🔵" },
          { word: "Yellow", emoji: "🟡" },
          { word: "Green", emoji: "🟢" },
          { word: "Orange", emoji: "🟠" },
          { word: "Purple", emoji: "🟣" },
          { word: "Black", emoji: "⚫" },
          { word: "White", emoji: "⚪" },
          { word: "Brown", emoji: "🟤" }
        ]
      }
    };

    let activeCategory = null;
    let totalStars = 0;
    
    // Play Mode State
    let playScore = 0;
    let currentPlayWord = null;
    let hasAnsweredCurrent = false;

    // --- Web Audio API for Sound Effects ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSFX(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'success') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.2); // C6
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'error') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      }
    }

    // --- Web Speech API for Native English Audio ---
    function speakWord(word) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85; // slightly slower for learning
      
      // Try to find a good US English voice
      const voices = window.speechSynthesis.getVoices();
      const usVoice = voices.find(v => v.lang === 'en-US' && (v.name.includes('Google') || v.name.includes('Samantha')));
      if(usVoice) utterance.voice = usVoice;

      window.speechSynthesis.speak(utterance);
    }

    // Load voices proactively
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>

  <script>
    function hideAllViews() {
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-menu').classList.add('hidden');
      document.getElementById('view-study').classList.add('hidden');
      document.getElementById('view-play').classList.add('hidden');
    }

    function goHome() {
      playSFX('pop');
      hideAllViews();
      document.getElementById('view-home').classList.remove('hidden');
    }

    function selectCategory(catId) {
      playSFX('pop');
      activeCategory = catId;
      const data = db[catId];
      
      document.getElementById('menu-icon').textContent = data.icon;
      document.getElementById('menu-title').textContent = data.title;
      
      hideAllViews();
      document.getElementById('view-menu').classList.remove('hidden');
      document.getElementById('view-menu').classList.add('animate-popIn');
    }

    function showMenu() {
      playSFX('pop');
      hideAllViews();
      document.getElementById('view-menu').classList.remove('hidden');
    }

    function updateGlobalStars(amount) {
      totalStars += amount;
      document.getElementById('globalStars').textContent = totalStars;
    }

    // --- STUDY MODE ---
    function startStudy() {
      playSFX('pop');
      hideAllViews();
      const view = document.getElementById('view-study');
      view.classList.remove('hidden');
      
      const data = db[activeCategory];
      document.getElementById('study-title').textContent = `Estudiar: ${data.title}`;
      
      const grid = document.getElementById('study-grid');
      grid.innerHTML = ''; // Clean up

      data.items.forEach(item => {
        const btn = document.createElement('button');
        btn.className = "bg-white border-4 border-slate-100 hover:border-brand-blue rounded-3xl p-6 flex flex-col items-center justify-center shadow-lg hover:shadow-xl transition-all active:scale-95 group";
        btn.innerHTML = `
          <div class="text-6xl sm:text-7xl mb-3 emoji-shadow group-hover:-translate-y-2 transition-transform">${item.emoji}</div>
          <div class="text-2xl font-kids font-bold text-slate-700 bg-slate-100 px-4 py-1 rounded-xl group-hover:bg-brand-blue group-hover:text-white transition-colors">${item.word}</div>
        `;
        btn.onclick = () => {
          playSFX('pop');
          speakWord(item.word);
          
          // Visual click effect
          btn.classList.add('scale-95');
          setTimeout(() => btn.classList.remove('scale-95'), 150);
        };
        grid.appendChild(btn);
      });
    }

    // --- PLAY MODE ---
    function startPlay() {
      playSFX('pop');
      playScore = 0;
      document.getElementById('play-score').textContent = playScore;
      
      hideAllViews();
      document.getElementById('view-play').classList.remove('hidden');
      loadPlayRound();
    }

    function loadPlayRound() {
      hasAnsweredCurrent = false;
      document.getElementById('play-feedback').classList.add('hidden');
      
      const data = db[activeCategory].items;
      
      // Select 1 correct word and 2 distractors
      const shuffled = [...data].sort(() => 0.5 - Math.random());
      currentPlayWord = shuffled[0];
      const distractors = [shuffled[1], shuffled[2]];
      
      const options = [currentPlayWord, ...distractors].sort(() => 0.5 - Math.random());

      const container = document.getElementById('play-options');
      container.innerHTML = ''; // Clear previous

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "bg-slate-50 border-4 border-slate-200 rounded-[2rem] p-4 flex items-center justify-center hover:bg-slate-100 hover:border-brand-blue transition-all active:scale-95 shadow-sm h-32";
        btn.innerHTML = `<span class="text-6xl emoji-shadow">${opt.emoji}</span>`;
        
        btn.onclick = () => handlePlayGuess(opt, btn);
        container.appendChild(btn);
      });

      // Auto-play audio after a short delay so Manuel is ready
      setTimeout(() => playCurrentWordAudio(), 500);
    }

    function playCurrentWordAudio() {
      if(currentPlayWord) {
        speakWord(currentPlayWord.word);
        playSFX('pop'); // Small feedback that button was pressed
      }
    }

    function handlePlayGuess(selectedOpt, btnElement) {
      if(hasAnsweredCurrent) return;

      if(selectedOpt.word === currentPlayWord.word) {
        // Correct!
        hasAnsweredCurrent = true;
        playSFX('success');
        playScore++;
        document.getElementById('play-score').textContent = playScore;
        updateGlobalStars(1);

        btnElement.classList.replace('border-slate-200', 'border-brand-green');
        btnElement.classList.replace('bg-slate-50', 'bg-green-100');
        
        showPlayFeedback("¡Excelente!", "🌟");

        if (window.confetti) {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#FCD34D', '#60A5FA', '#34D399'] });
        }

        setTimeout(() => loadPlayRound(), 2000);

      } else {
        // Incorrect
        playSFX('error');
        btnElement.classList.replace('border-slate-200', 'border-brand-red');
        btnElement.classList.add('animate-shake');
        
        // Remove animation class after it completes to allow re-triggering
        setTimeout(() => btnElement.classList.remove('animate-shake'), 400);
      }
    }

    function showPlayFeedback(text, emoji) {
      const feedback = document.getElementById('play-feedback');
      document.getElementById('feedback-text').textContent = text;
      document.getElementById('feedback-emoji').textContent = emoji;
      
      feedback.classList.remove('hidden');
      feedback.classList.add('flex');
    }
  </script>

</body>
</html>
